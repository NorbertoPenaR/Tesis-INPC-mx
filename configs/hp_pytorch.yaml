data:
  csv_path: data/ca56_2018a-2025_10_14.csv
  unique_id: Inflacion
  # Ultimo lunes que conserva 52 observaciones reales hasta 2025-09-22.
  cutoff: "2024-09-23"
  frequency: W-MON

hp:
  lambda: null

components:
  trend:
    transform: diff
    calendar: true
    fft_top_k: 8
  cycle:
    transform: none
    # El regimen reciente tiene una escala mucho menor que 1994--1996. Se
    # conservan diez anos semanales para ajustar y normalizar el ciclo.
    training_window: 520
    calendar: true
    fft_top_k: 8

experiment:
  model: rnn
  models: [rnn, lstm, deepar, transformer]
  horizon: 26
  rolling_horizons: [26, 52]
  rolling:
    windows: 4
    step: 52
  seed: 119

models:
  rnn: &recurrent
    context_length: 104
    architecture: {hidden_size: 32, num_layers: 1, dropout: 0.0}
    training: &training
      epochs: 80
      batch_size: 32
      learning_rate: 0.001
      weight_decay: 0.00001
      patience: 12
      gradient_clip: 1.0
      validation_fraction: 0.2
      seed: 119
      device: auto
    component_overrides:
      trend: {}
      cycle: {}
  lstm:
    <<: *recurrent
  deepar:
    <<: *recurrent
  transformer:
    context_length: 104
    architecture: {d_model: 32, num_layers: 2, nhead: 4, dim_feedforward: 64, dropout: 0.1}
    training:
      <<: *training
  xgboost:
    context_length: 104
    architecture: {n_estimators: 300, max_depth: 4, learning_rate: 0.03, subsample: 0.8, colsample_bytree: 0.8, reg_alpha: 0.0, reg_lambda: 1.0, random_state: 119, n_jobs: 1}
    component_overrides: {trend: {}, cycle: {}}
  holt_winters:
    context_length: 104
    architecture: {trend: null, damped_trend: false, seasonal: null, seasonal_periods: null}
    component_overrides: {trend: {}, cycle: {}}
