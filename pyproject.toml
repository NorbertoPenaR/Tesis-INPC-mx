[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inpc-forecasting"
version = "0.1.0"
description = "Pronostico del INPC mediante descomposicion HP y modelos PyTorch propios"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "torch>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
inpc-hp-forecast = "inpc_forecasting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
